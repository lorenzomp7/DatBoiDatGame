name: Build APK

# Compila l'APK con tools/build_apk.sh (senza Gradle) e, sui push su main,
# lo pubblica nella release «Ultima build».
on:
  push:
    branches: [main]
    paths: ["app/**", "tools/**", ".github/workflows/build-apk.yml"]
  pull_request:
    paths: ["app/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

# Un solo build per volta: un push nuovo annulla quello vecchio ancora in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK già presente sul runner (ANDROID_HOME): build-tools e platform.
      - name: Compila e firma l'APK
        run: bash tools/build_apk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: DatBoi-apk
          path: build/DatBoi.apk

      - name: Pubblica nella release «ultima-build»
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view ultima-build >/dev/null 2>&1 || \
            gh release create ultima-build --title "Ultima build" \
              --notes "APK aggiornato automaticamente a ogni push su main. Firmato con tools/debug.keystore, quindi si installa come aggiornamento delle build precedenti." || true
          gh release upload ultima-build build/DatBoi.apk --clobber
